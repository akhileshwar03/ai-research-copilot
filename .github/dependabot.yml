version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Must equal the version react-pdf nests, or the PDF viewer renders blank at runtime (the
      # build still passes, so CI can't catch it). Bump it together with react-pdf, by hand.
      - dependency-name: "pdfjs-dist"
      # eslint-config-next's plugins only support eslint <= 9 (invalid peers on 10).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Major jump with a type-check/build failure; used in one core layout file.
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
    groups:
      # Patch/minor bumps are low-risk (confirmed 2026-09-27: 14 of 16 non-major bumps that week
      # merged clean) — batch them into one PR/week instead of one branch per package. Majors are
      # deliberately left out of the group: two majors that same week (openai, eslint) had real,
      # CI-confirmed breakage, so those still need their own PR and individual review.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # 2.1 defaults postgresql:// to psycopg3 and would break startup migrations; see requirements.txt.
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "pgvector"
        update-types: ["version-update:semver-minor"]
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # GitHub Actions version bumps (runner versions, not application code) carry negligible
      # breakage risk even across majors, and there are only 3 actions in use — one PR for all of
      # them, any bump size, is the sensible default here.
      actions-all:
        update-types:
          - "major"
          - "minor"
          - "patch"
