name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest app/tests/ -q
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-used-in-prod
          OPENAI_API_KEY: sk-ci-placeholder
          RATE_LIMIT_ENABLED: "false"

  # 2026-09-24: production runs Postgres, but the job above tests against
  # SQLite (fast, zero setup — what every contributor gets by default
  # locally too). That mismatch already caused one real bug (a boolean
  # default migration that behaved differently on Postgres). This second
  # job runs the exact same suite against a real Postgres service
  # container instead, catching dialect-specific issues the SQLite job
  # can't. conftest.py picks the dialect up from DATABASE_URL automatically
  # — see its own comment for how.
  backend-postgres:
    name: Backend — pytest (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: querex
          POSTGRES_PASSWORD: querex
          POSTGRES_DB: querex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U querex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Real Alembic migrations, not conftest.py's Base.metadata.create_all()
      # shortcut (that's still what the SQLite job above uses) -- this is
      # what actually deploys to Render, so it's the only way CI verifies
      # the migrations themselves. It also creates alembic_version (which
      # the admin /system endpoint queries) and the pgvector extension
      # (migration 20260719_0011) in the right order, for free.
      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://querex:querex@localhost:5432/querex_ci

      - name: Run tests
        run: python -m pytest app/tests/ -q
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-used-in-prod
          OPENAI_API_KEY: sk-ci-placeholder
          RATE_LIMIT_ENABLED: "false"
          DATABASE_URL: postgresql://querex:querex@localhost:5432/querex_ci

  frontend:
    name: Frontend — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint app features components services shared stores

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_PUBLIC_API_PREFIX: /api/v1
