services:
  - type: web
    name: querex-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      # Neon Postgres — durable (idles but never hard-deletes on the free
      # tier, unlike Render's own free Postgres). Must have the pgvector
      # extension available; the app enables it automatically via migration.
      # Get the connection string from your Neon project dashboard.
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
        # Or set your own: openssl rand -hex 32
      - key: FRONTEND_ORIGINS
        sync: false
        # Your Vercel frontend URL, e.g. https://querex.vercel.app
      - key: FRONTEND_URL
        sync: false
        # Same as FRONTEND_ORIGINS but without a trailing slash
      - key: APP_BASE_URL
        sync: false
        # Your Render service URL, e.g. https://querex-backend.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1-mini
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
        # Comma-separated emails auto-promoted to admin on login,
        # e.g. you@example.com — gives access to /admin on the frontend.

      # Cloudflare R2 — private object storage for uploaded PDFs. All four
      # must be set or the app silently falls back to the instance's local
      # disk (ephemeral — wiped on every redeploy). Get these from the
      # Cloudflare dashboard: R2 > your bucket > Manage API tokens.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

    # NOTE: uploads_dir (local disk) is only used as a fallback when R2 env
    # vars above aren't set. With R2 configured, no Render disk is needed —
    # files and vector embeddings (pgvector, in the same Neon DB) both
    # survive redeploys.
